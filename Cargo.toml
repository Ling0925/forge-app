[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
forge-protocol = { path = "crates/forge-protocol" }
forge-store = { path = "crates/forge-store" }
forge-provider = { path = "crates/forge-provider" }
forge-tools = { path = "crates/forge-tools" }
forge-core = { path = "crates/forge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "process", "signal", "io-util", "net"] }
libc = "0.2"
thiserror = "2"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
httpdate = "1"
